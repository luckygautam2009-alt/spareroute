# docker-compose.yml — local development only
# Both services read from untracked .env files that you create from .env.example.
# NEVER commit .env files.
#
# Usage:
#   docker-compose up          # start all services
#   docker-compose up backend  # start only the SpareRoute backend
#   docker-compose down -v     # stop and remove volumes

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      # Override DATABASE_URL to point at the Compose postgres service
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/spareroute_db

  inquest-backend:
    build:
      context: ./inquest-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./inquest-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      PORT: 5001
      # Override DATABASE_URL to point at the Compose postgres service
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/inquest_db
      # Override SpareRoute URL to use the service name
      SPAREROUTE_API_URL: http://backend:4000

volumes:
  pgdata:
